<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Atrium — operations floor</title>
    <meta name="description" content="An operating system for a company staffed by AI agents. One operator, many rooms, several agents in each." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The bar the OS paints around the app. Light is the desk's default, whatever the
         machine prefers; the script below repaints this for anyone who chose dark. -->
    <meta name="theme-color" content="#f6f8fb" />

    <!-- The one face the desktop is set in. Preloaded because it is on the critical
         path: every label on the first screen waits for it otherwise. The extended
         range is not preloaded — almost nothing here needs it. -->
    <link rel="preload" href="/fonts/google-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Painted before the bundle parses, so a cold load is the desk's own colour
         rather than a white flash. Matches --solid in both themes. -->
    <style>
      html { background: #f6f8fb; }
      html[data-theme="dark"] { background: #0e1116; }
      body { margin: 0; }
    </style>

    <!-- Light is the default: a first visit is a lit desk even on a machine set to dark.
         Only a stored choice moves it, and it is stamped here rather than on mount so a
         returning dark operator never gets a light flash first. -->
    <script>
      try {
        var t = localStorage.getItem('atrium.theme') || 'light';
        var real = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
        document.documentElement.dataset.theme = real;
        document.documentElement.dataset.themeMode = t;
        if (real === 'dark')
          document.querySelector('meta[name=theme-color]').setAttribute('content', '#0e1116');
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
